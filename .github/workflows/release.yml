name: Build TLE SCHEDULE Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        working-directory: android
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TLE-SCHEDULE-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: TLE-SCHEDULE-Android.apk


  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows launcher
        shell: pwsh
        run: dotnet publish windows/TLEScheduleLauncher/TLEScheduleLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o windows/TLEScheduleLauncher/publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        working-directory: windows/TLEScheduleLauncher
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Rename installer
        shell: pwsh
        run: Copy-Item windows/TLEScheduleLauncher/installer-output/TLE-SCHEDULE-Windows-Setup.exe TLE-SCHEDULE-Windows-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: TLE-SCHEDULE-Windows-Setup.exe


  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - android
      - windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            TLE-SCHEDULE-Android.apk
            TLE-SCHEDULE-Windows-Setup.exe
